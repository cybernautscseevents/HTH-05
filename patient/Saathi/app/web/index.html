<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Saathi patient portal.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Saathi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Saathi</title>
  <link rel="manifest" href="manifest.json">
  <script>
    (function() {
      window.__saathiActiveStreams = [];
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        var origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = async function(constraints) {
          var stream = await origGetUserMedia(constraints);
          window.__saathiActiveStreams.push(stream);
          return stream;
        };
      }

      window.stopAllSaathiCameras = function() {
        if (window.__saathiActiveStreams && window.__saathiActiveStreams.length > 0) {
          window.__saathiActiveStreams.forEach(function(stream) {
            try {
              if (stream && stream.getTracks) {
                var tracks = stream.getTracks();
                for (var i = 0; i < tracks.length; i++) {
                  try {
                    tracks[i].stop();
                  } catch (e) {}
                }
              }
            } catch (e) {}
          });
          window.__saathiActiveStreams = [];
        }
        try {
          var videos = document.querySelectorAll('video');
          for (var j = 0; j < videos.length; j++) {
            var v = videos[j];
            try {
              if (v.srcObject && v.srcObject.getTracks) {
                var vTracks = v.srcObject.getTracks();
                for (var k = 0; k < vTracks.length; k++) {
                  try {
                    vTracks[k].stop();
                  } catch (e) {}
                }
              }
              v.srcObject = null;
              v.pause();
            } catch (e) {}
          }
        } catch (e) {}
      };
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
