services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: saathi
      MYSQL_USER: saathi
      MYSQL_PASSWORD: saathi_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - saathi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  saathi_mysql:

